name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install recorded Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Use recorded Rust toolchain
        run: rustup override set 1.98.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run package:installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: |
            src-tauri/target/release/wrakeeb-launcher.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 30
